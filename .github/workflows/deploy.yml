name: GH Pages deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm ci

      - name: Check frontend API URL is configured
        run: |
          if [ -z "$VITE_SYNTAX_API_URL" ]; then
            echo "VITE_SYNTAX_API_URL is not set. Configure it in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
        env:
          VITE_SYNTAX_API_URL: ${{ vars['VITE_SYNTAX_API_URL'] }}
      
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_SYNTAX_API_URL: ${{ vars['VITE_SYNTAX_API_URL'] }}
      
      - run: ls -la dist/
      
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false

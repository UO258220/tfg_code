<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASM RDF Validator</title>
  <script type="module" crossorigin src="/tfg_code/assets/main-DHxrs9Ta.js"></script>
  <link rel="stylesheet" crossorigin href="/tfg_code/assets/style-3k0LUsO-.css">
</head>
<body>
  <nav class="topbar">
    <div class="topbar__brand">
      <span class="logo">WASM RDF Validator</span>
    </div>
    <div class="topbar__links">
      <a href="./index.html" class="topbar__link active" id="topbar-home" aria-current="page">Home</a>
      <a href="https://github.com/UO258220/tfg_code" class="topbar__link" id="topbar-docs">Docs</a>
      <a href="./about.html" class="topbar__link" id="topbar-about">About</a>
    </div>
  </nav>

  <main class="page">
    <section class="hero">
      <div class="hero__content">
        <h1>Validate RDF with SHACL</h1>
        <p>Paste your RDF document and get instant validation feedback from the backend service.</p>
      </div>
    </section>

    <section class="app-shell">
      <div class="panel panel--input">
        <label for="rdf-input" class="field-label">RDF data</label>
        <textarea id="rdf-input" class="editor" placeholder="Paste RDF data here"></textarea>

        <label for="shacl-input" class="field-label shacl-label">SHACL shapes</label>
        <textarea id="shacl-input" class="editor" placeholder="Paste SHACL shapes here"></textarea>

        <div class="panel__actions">
          <button id="validate-btn" class="button-27" onclick="handleValidateRDF()">Validate</button>
        </div>
      </div>

      <div class="panel panel--output">
        <div class="panel__header">
          <div>
            <h2>Validation Result</h2>
            <p class="panel__subtitle">Status and details appear here.</p>
          </div>
        </div>

        <div id="rdf-result" class="result-card status-info">Enter RDF data and/or SHACL shapes and click Validate.</div>
        <textarea id="rdf-result-secondary" class="result-secondary" readonly></textarea>
      </div>
    </section>

    <footer class="footer">
      <p>Built with Rust + WebAssembly</p>
    </footer>
  </main>

 </body>
</html>
